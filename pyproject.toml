[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "TareaSemana4"
version = "0.0.1"
description = "Actividad Individual | C\u00f3digo de experimentaci\u00f3n base con MLFlow"
authors = [
  { name = "AxelRabago" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.14.0"


[tool.ruff]
line-length = 99
src = ["TareaSemana4"]
include = ["pyproject.toml", "TareaSemana4/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["TareaSemana4"]
force-sort-within-sections = true

